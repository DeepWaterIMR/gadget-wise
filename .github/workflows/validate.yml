name: Validate scaffold and synthetic models
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: gadget-wise
      - uses: actions/checkout@v4
        with:
          repository: DeepWaterIMR/wise-writing
          path: wise-writing
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::yaml
            any::jsonlite
            any::tidyverse
            any::TMB
            any::RcppEigen
            any::cowplot
            any::pbapply
            any::remotes
            github::gadget-framework/gadget3
            github::gadget-framework/gadgetutils
            github::gadget-framework/gadgetplots
            github::gadget-framework/g3experiments
      - name: Scaffold both layouts and fit the synthetic models
        working-directory: gadget-wise
        run: Rscript config/validate-scaffold.R
