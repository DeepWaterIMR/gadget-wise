name: Validate scaffold and synthetic models
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: gadget-wise
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: DeepWaterIMR/wise-writing
          path: wise-writing
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          packages: |
            any::yaml
            any::jsonlite
            any::tidyverse
            any::TMB
            any::RcppEigen
            any::cowplot
            any::pbapply
            any::remotes
            github::gadget-framework/gadget3
            github::gadget-framework/gadgetutils
            github::gadget-framework/gadgetplots
            github::gadget-framework/g3experiments
      - name: Scaffold both layouts and fit the synthetic models
        working-directory: gadget-wise
        run: Rscript config/validate-scaffold.R
